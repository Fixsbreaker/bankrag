services:
  bankrag:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Артефакты готовятся на машине: make build && make eval.
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      # Решения аналитика сохраняются здесь.
      - ./data/feedback:/app/data/feedback
