# Пути, пороги, размеры выборок и seed проекта.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports

dataset:
  prefix: HI-Small

split:
  # Доли считаются по числу транзакций, порядок по времени сохраняется.
  fractions: [0.6, 0.2, 0.2]
  # С этого момента обычных переводов почти нет; тест считается с хвостом и без него.
  tail_start: "2022-09-11"

features:
  window_hours: 48
  # Окна обучения перекрываются, валидация и тест используют по одному окну.
  train_step_hours: 12
  # Ночь: от первого часа включительно до второго не включая.
  night_hours: [0, 6]

rule:
  # Второй сигнал очереди. Значения заданы вручную: на валидации и тесте IBM они не подбирались.
  fast_transit:
    min_senders: 3
    min_transit: 0.8
    max_transit: 1.2
    max_forward_minutes: 60
  grid:
    min_senders: [1, 2, 3, 4, 5, 8, 12]
    min_transit: [0.3, 0.5, 0.7, 0.8, 0.9, 0.95]
    max_forward_minutes: [15, 60, 240, 720, 1440, 2880]

model:
  num_boost_round: 1500
  early_stopping_rounds: 150
  # Настройки выбраны по PR-AUC на валидации; тест при выборе не использовался.
  params:
    objective: binary
    metric: average_precision
    learning_rate: 0.02
    num_leaves: 7
    min_data_in_leaf: 20
    lambda_l2: 5
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    # Дропов в тысячи раз меньше чистых. Полная балансировка (is_unbalance) давала
    # PR-AUC 0,02, вес 10 работает лучше.
    scale_pos_weight: 10

similarity:
  k: 10
  m: 32
  ef_construction: 200
  ef_search: 128
  timing_queries: 1000

evaluate:
  bootstrap_rounds: 200
  queue_sizes: [100, 500]

app:
  queue_rows: 500

report:
  top_k: 3
  # Посторонние запросы дают близость до 0,76, запросы по признакам счёта от 0,83.
  # Порог выбран по нескольким проверочным запросам, это не строгая калибровка.
  min_similarity: 0.8

# Казахстанский набор: свои клиенты, фон и сети дропов. Всё сгенерировано командой,
# параметры не откалиброваны на реальных данных.
kz_scenarios:
  # Пороги правила быстрого транзита выбирались на сетях с seed 42,
  # поэтому в отчёт идут сети с другим seed.
  seed: 2026
  start: "2026-11-01 00:00"
  end: "2026-11-04 00:00"
  # Признаки для модели считаются за последние 48 часов, как в IBM.
  features_hours: 48
  clients: 3000
  employers: 15
  merchants: 80
  atms: 20
  salary_share: 0.35
  salary_tenge: [250000, 700000]
  purchases_per_client: 3
  purchase_tenge: [2000, 40000]
  family_share: 0.2
  family_tenge: [10000, 100000]
  cash_share: 0.1
  cash_tenge: [20000, 100000]
  networks: 30
  victims: [5, 10]
  victim_tenge: [50000, 600000]
  complaint_share: 0.4
  depth: [2, 4]
  split_width: [2, 3]
  forward_minutes: [5, 30]
  forward_share: [0.92, 0.98]
  split_noise: 0.03
  cash_out_minutes: [60, 180]
  # Доля дропов, у которых до сети была обычная история (зарплата, покупки).
  mule_with_history_share: 0.5
  # Тенге в наборе IBM нет. Это допущение для перевода сумм в доллары, а не курс на дату.
  tenge_per_usd: 500
  # Главный пример демо: жалоба клиентки.
  demo:
    victim_time: "2026-11-03 14:05"
    victim_tenge: 500000
    depth: 3
    split_width: 2
    other_victims: 8
    other_complaints: 2

# Флажки подозрительности. Стартовые пороги из обсуждения команды, проверены на сетях seed 42.
flags:
  window_hours: 72
  transit_share: 0.8
  fast_forward_minutes: 60
  # Пересылка считается, если ушло не меньше этой доли поступления.
  min_forward_share: 0.5
  cash_min_share: 0.5
  many_senders: 5
  many_senders_hours: 24
  split_min_parts: 2
  # Части считаются равными, если крупная больше мелкой не больше чем во столько раз.
  split_max_ratio: 1.25
  split_min_share: 0.5

# Цвет счёта на графе.
colors:
  # Высокий риск — порог тревоги модели из reports/model.json, средний — его доля.
  medium_risk_share: 0.5
  # Зелёный только при длинной обычной истории.
  green_min_transfers: 5

llm:
  url: http://localhost:11434
  model: qwen3:14b
  fallback_model: qwen3:8b
  temperature: 0
  think: false
  max_tool_calls: 4
  timeout_seconds: 180
  keep_alive: 30m

chat:
  history_turns: 6
  trace_window_hours: 72
  trace_max_depth: 4
  trace_max_branches: 5
  # След идёт по исходящим переводам по времени, пока не покрыта эта доля поступления.
  trace_cover_share: 0.9
  network_depth: 2
  network_limit: 50
  # Узлы с таким числом контрагентов (магазины, работодатели) в сети не раскрываются.
  hub_degree: 40
  list_limit: 10
